[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.3.0"
description = "Loom — kernel library for multi-agent LLM chatrooms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harsh Dubey" }]
keywords = ["llm", "agents", "multi-agent", "chatroom", "kernel", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage      = "https://github.com/hdubey-debug/loom"
Repository    = "https://github.com/hdubey-debug/loom"
Issues        = "https://github.com/hdubey-debug/loom/issues"
Changelog     = "https://github.com/hdubey-debug/loom/blob/main/CHANGELOG.md"
Documentation = "https://github.com/hdubey-debug/loom/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-repeat>=0.9",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "mutmut>=3.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "psutil>=5.9",
]
# Optional perf extras — enabled via ``pip install -e .[perf]``. The
# kernel falls back to stdlib (json) when these are missing, so CI / the
# default suite never depends on them. ``orjson`` is a 3rd-party C dep
# with platform wheels; profiling tools (pyinstrument/viztracer) are
# dev-only attachments to ``benchmarks/perf.py``.
perf = [
    "orjson>=3.10",
    "pyinstrument>=4.6",
    "viztracer>=0.16",
]

[tool.setuptools.packages.find]
include = ["loom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "stress: heavy multi-turn or large-N load",
    "timing: timing-sensitive (sleeps, monotonic clock)",
    "disk: writes to on-disk journal",
    "breakpoint: limit-finding probe (prints measured threshold)",
    "watchdog: per-test watchdog override",
    "property: Hypothesis-driven fuzz test",
    "slow: > 5s wall-clock",
    "perf: opt-in microbench; excluded from default suite (run via make bench)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to assign-and-not-use (intentional snapshots in race
# probes), reuse short loop names, and import a few helpers eagerly.
"tests/**/*.py" = ["F841", "E741", "F541"]

[tool.coverage.run]
source = ["loom"]
branch = true
data_file = "/tmp/.coverage_loom"

[tool.coverage.report]
fail_under = 98
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mutmut]
paths_to_mutate = ["loom/kernel/", "loom/policy/", "loom/adapters.py"]
tests_dir = ["tests/", "tests/subsystem/"]
pytest_add_cli_args = ["-x", "-q", "-p", "no:cacheprovider",
                       "-m", "not stress and not breakpoint"]
